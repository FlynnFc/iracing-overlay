# Build, lint and test on every push and pull request, on the same platform
# the app ships for. No `cargo fmt --check`: the tree has mixed CRLF/LF line
# endings by design and a formatting gate would trip on them, not on code.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
